openapi: 3.1.0
info:
  title: ChatGPT Web Agent OAuth API
  version: 0.3.0
  description: >-
    OAuth-protected API for a user-owned Chrome session and WordPress site.
    The full Custom GPT schema is also maintained at chatgpt-action/openapi.yaml.
servers:
  - url: https://agent.example.com
security:
  - webAgentOAuth: [agent:control]
paths:
  /health:
    get:
      security: []
      operationId: webAgentHealth
      summary: Check the OAuth gateway
      responses:
        '200': { description: Healthy }
  /v1/browser/status:
    get:
      operationId: browserStatus
      summary: Check whether the Chrome extension is connected
      responses:
        '200': { description: Browser status }
  /v1/browser/action:
    post:
      operationId: browserAction
      summary: Execute one approved Chrome action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [tabs.list, tab.active, tab.navigate, tab.reload, page.wait, page.read, page.inspect, page.elements, page.click, page.type, page.scroll, page.viewport.get, page.viewport.set, page.viewport.clear, page.screenshot, page.elementScreenshot, debug.start, debug.logs, debug.clear, debug.stop]
                args:
                  type: object
                  additionalProperties: true
      responses:
        '200': { description: Browser action result }
  /v1/wordpress/site:
    get:
      operationId: wordpressSite
      summary: Inspect the connected WordPress site
      responses:
        '200': { description: Site details }
  /v1/wordpress/pages:
    get:
      operationId: wordpressPages
      summary: List or search WordPress pages
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200': { description: Pages }
    post:
      operationId: wordpressCreatePage
      summary: Create a WordPress page
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PageWrite' }
      responses:
        '201': { description: Page created }
  /v1/wordpress/pages/{id}:
    get:
      operationId: wordpressGetPage
      summary: Read a WordPress page
      parameters:
        - $ref: '#/components/parameters/PageId'
      responses:
        '200': { description: Page }
    patch:
      operationId: wordpressUpdatePage
      summary: Update a WordPress page
      parameters:
        - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PageWrite' }
      responses:
        '200': { description: Page updated }
  /v1/targets:
    post:
      operationId: createImplementationTarget
      summary: Create a Figma, HTML, image, or website implementation target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201': { description: Target created }
  /v1/targets/{id}:
    get:
      operationId: getImplementationTarget
      summary: Read target and verification state
      parameters:
        - $ref: '#/components/parameters/TargetId'
      responses:
        '200': { description: Target }
    patch:
      operationId: updateImplementationTarget
      summary: Update target state
      parameters:
        - $ref: '#/components/parameters/TargetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200': { description: Target updated }
  /v1/verification/capture:
    post:
      operationId: captureImplementation
      summary: Capture Chrome visual, DOM, styles, console, and network evidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200': { description: Observation }
  /v1/verification/compare:
    post:
      operationId: compareImplementation
      summary: Compare implementation with a reference and update repair status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200': { description: Comparison }
components:
  securitySchemes:
    webAgentOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://agent.example.com/oauth/authorize
          tokenUrl: https://agent.example.com/oauth/token
          scopes:
            agent:control: Inspect, build, verify, and repair the connected website
  parameters:
    PageId:
      in: path
      name: id
      required: true
      schema: { type: integer }
    TargetId:
      in: path
      name: id
      required: true
      schema: { type: string }
  schemas:
    PageWrite:
      type: object
      properties:
        title: { type: string }
        slug: { type: string }
        status: { type: string, enum: [draft, publish, pending, private] }
        content: { type: string }
