openapi: 3.1.0
info:
  title: ChatGPT Web Agent Browser API
  version: 0.4.0
  description: >-
    OAuth-protected browser-agent API for controlling a user-approved Chrome
    session directly. It is website-agnostic: WordPress, Figma, Shopify,
    Elementor, admin dashboards, and other web apps are operated through Chrome.
servers:
  - url: https://agent.example.com
security:
  - webAgentOAuth: [agent:control]
paths:
  /health:
    get:
      security: []
      operationId: webAgentHealth
      summary: Check the Web Agent OAuth gateway
      responses:
        '200': { description: Gateway status }

  /v1/browser/status:
    get:
      operationId: browserStatus
      summary: Check whether the user's Chrome extension is connected
      responses:
        '200': { description: Browser connection status }

  /v1/browser/action:
    post:
      operationId: browserAction
      summary: Inspect or operate the user's approved Chrome session
      description: >-
        Prefer DOM/accessibility actions when possible. Use coordinate actions for
        canvas-heavy or visual editors such as Figma and Elementor when DOM targets
        are unavailable. Screenshot before coordinate-based actions when uncertain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum:
                    - tabs.list
                    - tabs.open
                    - tabs.switch
                    - tabs.close
                    - tab.active
                    - tab.navigate
                    - tab.reload
                    - tab.back
                    - tab.forward
                    - page.wait
                    - page.read
                    - page.inspect
                    - page.elements
                    - page.elementAt
                    - page.accessibility
                    - page.click
                    - page.doubleClick
                    - page.rightClick
                    - page.hover
                    - page.type
                    - page.key
                    - page.scroll
                    - page.drag
                    - page.upload
                    - page.viewport.get
                    - page.viewport.set
                    - page.viewport.clear
                    - page.screenshot
                    - page.elementScreenshot
                    - debug.start
                    - debug.logs
                    - debug.clear
                    - debug.stop
                args:
                  type: object
                  additionalProperties: true
                  description: >-
                    Arguments depend on action. Common fields: tabId, url, selector,
                    x, y, text, key, code, modifiers, width, height, fullPage,
                    fromSelector/fromX/fromY, toSelector/toX/toY, dataUrl, filename.
      responses:
        '200': { description: Browser action result }

  /v1/targets:
    post:
      operationId: createImplementationTarget
      summary: Create a persistent design or website implementation target
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TargetCreate' }
      responses:
        '201': { description: Target created }

  /v1/targets/{id}:
    get:
      operationId: getImplementationTarget
      summary: Read target state and viewport verification progress
      parameters:
        - $ref: '#/components/parameters/TargetId'
      responses:
        '200': { description: Target state }
    patch:
      operationId: updateImplementationTarget
      summary: Update target source, destination, status, viewports, or notes
      parameters:
        - $ref: '#/components/parameters/TargetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200': { description: Target updated }

  /v1/verification/capture:
    post:
      operationId: captureImplementation
      summary: Navigate and collect screenshot, DOM, style, console, and network evidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureRequest' }
      responses:
        '200': { description: Browser observation }

  /v1/verification/compare:
    post:
      operationId: compareImplementation
      summary: Compare a browser capture against a reference image
      description: >-
        Repeat for all required viewports. A target is complete only when every
        configured viewport passes its visual threshold.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompareRequest' }
      responses:
        '200': { description: Similarity metrics and target status }

components:
  securitySchemes:
    webAgentOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://agent.example.com/oauth/authorize
          tokenUrl: https://agent.example.com/oauth/token
          scopes:
            agent:control: Inspect and operate the user's approved Chrome session
  parameters:
    TargetId:
      in: path
      name: id
      required: true
      schema: { type: string }
  schemas:
    Viewport:
      type: object
      properties:
        label: { type: string }
        width: { type: integer, minimum: 240, maximum: 3840 }
        height: { type: integer, minimum: 320, maximum: 2160 }
        deviceScaleFactor: { type: number, minimum: 0.5, maximum: 4 }
        mobile: { type: boolean }
    TargetCreate:
      type: object
      properties:
        name: { type: string }
        source:
          type: object
          additionalProperties: true
          description: Figma URL/node, HTML reference, screenshot, image, or source website metadata.
        destination:
          type: object
          additionalProperties: true
          description: Destination website URL, section/page notes, and optional selectors.
        viewports:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/Viewport' }
        notes: { type: string }
    CaptureRequest:
      type: object
      properties:
        targetId: { type: string }
        url: { type: string, format: uri }
        viewport: { $ref: '#/components/schemas/Viewport' }
        selectors:
          type: array
          maxItems: 20
          items: { type: string }
        includeDebug: { type: boolean, default: true }
        errorsOnly: { type: boolean }
        fullPage: { type: boolean }
        settleMs: { type: integer, minimum: 0, maximum: 5000 }
        maxLength: { type: integer, minimum: 1000, maximum: 100000 }
    CompareRequest:
      type: object
      properties:
        targetId: { type: string }
        referenceUrl: { type: string, format: uri }
        referenceDataUrl: { type: string }
        candidateDataUrl: { type: string }
        passThreshold: { type: number, minimum: 0, maximum: 1, default: 0.92 }
        includeDiff: { type: boolean }
        includeCandidateImage: { type: boolean }
        capture: { $ref: '#/components/schemas/CaptureRequest' }
