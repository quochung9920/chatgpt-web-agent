name: CI

on:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check server JavaScript syntax
        run: |
          node --check server/src/browser-backend.js
          node --check server/src/target-store.js
          node --check server/src/oauth.js
          node --check server/src/oauth-gateway.js

      - name: Check Chrome extension JavaScript syntax
        run: |
          node --check chrome-extension/background.js
          node --check chrome-extension/service-worker.js
          node --check chrome-extension/service-worker-entry.js
          node --check chrome-extension/sidepanel-scope.js
          node --check chrome-extension/local-browser-tools.js
          node --check chrome-extension/tab-group-session.js
          node --check chrome-extension/group-scoped-tools.js
          node --check chrome-extension/agent-tools.js
          node --check chrome-extension/agent-policy.js
          node --check chrome-extension/group-ui.js
          node --check chrome-extension/permission-ui.js
          node --check chrome-extension/chatgpt-content.js
          node --check chrome-extension/options.js
          node --check chrome-extension/sidepanel.js
